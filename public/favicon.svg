<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="sm-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Badge with soft border -->
  <rect width="64" height="64" rx="18" fill="url(#sm-bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="16.5" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  <!-- Isometric 3D Accent Node -->
  <circle cx="50" cy="14" r="3.5" fill="#38bdf8"/>
  <!-- Monogram SM -->
  <text x="32" y="44" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1.2" filter="url(#shadow)">SM</text>
  <!-- Subtle brand underline -->
  <rect x="22" y="48" width="20" height="2.5" rx="1.25" fill="url(#sm-accent)"/>
</svg>
